[test-groups]
# Tests that bind ports or use global resources must run
# in isolation to avoid conflicts such as "Address already in use".
run-in-isolation = { max-threads = 1 }

[profile.default]
# Generous timeout for network tests; QUIC and mDNS handshakes can be slow.
slow-timeout = { period = "20s", terminate-after = 2 }
# Conservative parallelism because network tests may compete for ports.
test-threads = 4

[[profile.default.overrides]]
filter = 'test(::run_in_isolation::)'
test-group = 'run-in-isolation'

[profile.ci]
# CI usually has higher network/IO latency, so tests get more headroom
# before being terminated.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = 2
