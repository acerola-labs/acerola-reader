# License management
[licenses]
version = 2
confidence-threshold = 0.8 
allow = [
  # Project licenses
  "MPL-2.0",
  
  # Dependency licenses (Iroh, etc)
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  
  # Dependency-specific permissive licenses
  "bzip2-1.0.6",
  "NCSA",
]

[bans]
deny = [
  # Example: ban C libraries that make cross-platform builds harder
  {name = "openssl", reason = "Use rustls for native Rust security"},
  {name = "native-tls", reason = "Use rustls"},
] 
multiple-versions = "warn" # Warn on duplicate library versions
skip = [] 
wildcards = "allow" 

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # "RUSTSEC-202X-XXXX", # Add IDs here to ignore specific advisories
] 
unmaintained = "all"
unsound = "all"
yanked = "deny"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"