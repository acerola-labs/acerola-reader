[profile.default]
# Generous timeout: the transfer integrity tests (`exchange.rs`) move real
# megabytes in memory via `tokio::io::duplex` — slow on loaded machines, but
# none of them depend on a real network (no port binding), so they do not need
# `run_in_isolation`-style isolation (pattern used in acerola-p2p/acerola-desktop for tests
# that actually bind ports).
slow-timeout = { period = "20s", terminate-after = 2 }
test-threads = 4

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = 2
