    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[chore](deps)'
    labels:
      - 'dependencies'
      - 'iroh'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[chore](ci)'
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      actions:
        patterns:
          - '*'
