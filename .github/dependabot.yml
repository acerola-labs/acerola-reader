# Acerola standard: weekly PRs on `develop`, grouped, with the message in the project format.
# One block per ecosystem and app folder.
version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/acerola/android'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: '[chore](deps)'
    labels:
      - 'dependencies'
      - 'android'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'cargo'
    directory: '/acerola/android/native/rust'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: '[chore](deps)'
    labels:
      - 'dependencies'
      - 'android'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
