name: "Tests/Desktop"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'acerola/desktop/**'
      - 'lib/p2p/**'
      - 'scripts/design/**'
      - 'scripts/i18n/**'
      - 'acerola.config.json'
      - '.github/workflows/desktop-tests.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'acerola/desktop/**'
      - 'lib/p2p/**'
      - 'scripts/design/**'
      - 'scripts/i18n/**'
      - 'acerola.config.json'
      - '.github/workflows/desktop-tests.yml'
  workflow_dispatch:

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: Acerola standard (design and i18n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0

      - name: Design
        run: node scripts/design/check-design.mjs

      - name: i18n
        run: node scripts/i18n/check-i18n.mjs

  rust:
    name: Rust Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('acerola/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-make.exe
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-llvm-cov.exe
          key: ${{ runner.os }}-cargo-test-tools-v2

      - name: Install Cargo test tools
        run: |
          $cargoBin = "$HOME/.cargo/bin"
          New-Item -ItemType Directory -Force $cargoBin | Out-Null

          if (!(Test-Path "$cargoBin/cargo-make.exe")) {
            cargo install cargo-make --locked
          }

          if (!(Test-Path "$cargoBin/cargo-nextest.exe")) {
            cargo install cargo-nextest --locked
          }

          if (!(Test-Path "$cargoBin/cargo-llvm-cov.exe")) {
            cargo install cargo-llvm-cov --locked
          }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Cache Rust test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: acerola/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-target-rust-${{ hashFiles('acerola/desktop/src-tauri/Cargo.lock', 'acerola/desktop/src-tauri/Cargo.toml', 'acerola/desktop/src-tauri/makefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-rust-

      - name: Run Rust checks and tests
        run: cargo make --makefile makefile.toml --cwd ./src-tauri ci

      - name: Run Rust coverage
        run: cargo make --makefile makefile.toml --cwd ./src-tauri coverage

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-lcov
          path: acerola/desktop/src-tauri/lcov.info

  check:
    name: Svelte Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  lint:
    name: Svelte Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    name: Svelte Unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage:unit

      - name: Upload Svelte coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: svelte-coverage
          path: acerola/desktop/coverage

  integration:
    name: Svelte Integration (real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

  storybook:
    name: Storybook (stories as tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:storybook

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: acerola/desktop/playwright-report
