name: "Release/Desktop"

on:
  push:
    tags:
      - 'desktop/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acerola/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('acerola/desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        shell: bash
        run: |
          CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          TAG_NAME="desktop/${CHANNEL}/v${VERSION}"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update versions (tauri.conf.json, Cargo.toml, package.json)
        working-directory: ${{ github.workspace }}
        run: cargo make --makefile makefile.toml bump-desktop
        env:
          VERSION: ${{ env.VERSION }}

      - name: Install winapp
        run: npm install -g @microsoft/winappcli

      - name: Initialize MSIX & Generate Certificate
        run: >
          npm run make --
          -e MSIX_PACKAGE_NAME="${{ secrets.MSIX_PACKAGE_NAME }}"
          -e MSIX_PUBLISHER="${{ secrets.MSIX_PUBLISHER }}"
          -e MSIX_PUBLISHER_DISPLAY_NAME="${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"
          -e MSIX_VERSION="${{ env.VERSION }}.0"
          init-msix

      - name: Build and Package (EXE, MSI, MSIX)
        run: npm run make cd

      - name: Rename Artifacts
        shell: powershell
        run: |
          Rename-Item (Get-Item ".bin\windows\msix\*.msix").FullName "acerola-x64-${{ env.VERSION }}.msix"
          Rename-Item (Get-Item ".bin\windows\msi\*.msi").FullName "acerola-x64-${{ env.VERSION }}.msi"
          Rename-Item (Get-Item ".bin\windows\exe\*.exe").FullName "acerola-x64-${{ env.VERSION }}.exe"

      - name: Commit version bump
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola/desktop/src-tauri/tauri.conf.json acerola/desktop/src-tauri/Cargo.toml acerola/desktop/package.json
          if ! git diff --staged --quiet; then
            git commit -m "[build](desktop): Versão ${{ env.VERSION }} [skip ci]"
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done
            BUMP_SHA=$(git rev-parse HEAD)

            # develop gets the very same commit when it has nothing main lacks, so both stay
            # identical; only when develop is ahead the bump is cherry-picked on top of it.
            git fetch origin develop
            if git merge-base --is-ancestor origin/develop "$BUMP_SHA"; then
              git push origin "$BUMP_SHA:refs/heads/develop"
            else
              git checkout -B develop origin/develop
              git cherry-pick "$BUMP_SHA"
              git checkout -- .
              until git push origin develop; do
                git fetch origin develop
                git checkout -- .
                git rebase origin/develop
              done
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Acerola Desktop v${{ env.VERSION }}
          draft: false
          prerelease: ${{ env.CHANNEL != 'prod' }}
          files: |
            acerola/desktop/.bin/windows/msix/acerola-x64-${{ env.VERSION }}.msix
            acerola/desktop/.bin/windows/msi/acerola-x64-${{ env.VERSION }}.msi
            acerola/desktop/.bin/windows/exe/acerola-x64-${{ env.VERSION }}.exe
          generate_release_notes: true
