name: "Release/Desktop"

on:
  push:
    tags:
      - 'desktop/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# The version is written in the release PR (release/X.Y.Z, CLAUDE.md): the tag
# desktop/<channel>/vX.Y.Z, made on that merge on main, must match tauri.conf.json, Cargo.toml and
# package.json. Only GitHub's own actions, pinned by SHA (acerola-labs refuses any other).
jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Extract version
        shell: bash
        run: |
          CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag against the manifests
        shell: bash
        run: |
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          for found in "$tauri" "$pkg" "$cargo"; do
            if [ "$found" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME differs from the manifests (tauri $tauri, package $pkg, cargo $cargo)."
              exit 1
            fi
          done

      # The release text is the version's section in acerola/desktop/RELEASE.md (acerola-git 5):
      # without it the release stops here, before the build.
      - name: Read the release notes
        shell: bash
        run: node ../../scripts/release/release-notes.mjs "$VERSION" RELEASE.md > release-notes.md

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acerola/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('acerola/desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Install winapp
        run: npm install -g @microsoft/winappcli

      - name: Initialize MSIX & Generate Certificate
        run: >
          npm run make --
          -e MSIX_PACKAGE_NAME="${{ secrets.MSIX_PACKAGE_NAME }}"
          -e MSIX_PUBLISHER="${{ secrets.MSIX_PUBLISHER }}"
          -e MSIX_PUBLISHER_DISPLAY_NAME="${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"
          -e MSIX_VERSION="${{ env.VERSION }}.0"
          init-msix

      - name: Build and Package (EXE, MSI, MSIX)
        run: npm run make cd

      - name: Rename Artifacts
        shell: powershell
        run: |
          Rename-Item (Get-Item ".bin\windows\msix\*.msix").FullName "acerola-x64-${{ env.VERSION }}.msix"
          Rename-Item (Get-Item ".bin\windows\msi\*.msi").FullName "acerola-x64-${{ env.VERSION }}.msi"
          Rename-Item (Get-Item ".bin\windows\exe\*.exe").FullName "acerola-x64-${{ env.VERSION }}.exe"

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            ".bin/windows/msix/acerola-x64-$VERSION.msix"
            ".bin/windows/msi/acerola-x64-$VERSION.msi"
            ".bin/windows/exe/acerola-x64-$VERSION.exe"
          )
          prerelease=""
          if [ "$CHANNEL" != "prod" ]; then prerelease="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Versão $VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag $prerelease \
              --title "Versão $VERSION" --notes-file release-notes.md
          fi
