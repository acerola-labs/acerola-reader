name: "Tests/Android"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'acerola/android/**'
      - 'lib/p2p/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'acerola/android/**'
      - 'lib/p2p/**'
      - '.github/workflows/android-tests.yml'
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Run unit tests
        run: ./gradlew test
        working-directory: acerola/android

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            acerola/android/**/build/reports/tests/
            acerola/android/**/build/test-results/
          retention-days: 7

      - name: Generate coverage report (Kover)
        run: ./gradlew koverXmlReport
        working-directory: acerola/android

      # Coverage stays as an artifact: acerola-labs only runs GitHub's own actions.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-report
          path: acerola/android/build/reports/kover/report.xml
