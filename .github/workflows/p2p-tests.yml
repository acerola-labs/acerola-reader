name: "Tests/P2P"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'lib/p2p/**'
      - '.github/workflows/p2p-tests.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'lib/p2p/**'
      - '.github/workflows/p2p-tests.yml'
  schedule:
    - cron: '0 0 * * 0' # Weekly (Sunday at midnight)
  workflow_dispatch:

concurrency:
  group: p2p-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Build & Test (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/p2p/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('lib/p2p/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # After the cache restores ~/.cargo, so an installed tool is not reinstalled.
      - name: Install cargo-make and cargo-nextest
        shell: bash
        run: |
          command -v cargo-make >/dev/null || cargo install cargo-make --locked
          command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked

      - name: Build
        run: cargo make --makefile makefile.toml build

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cargo make --makefile makefile.toml test-ci

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate Code Coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Check Minimum Coverage Gate (80%)
        run: cargo llvm-cov report --fail-under-lines 80

      # Coverage stays as an artifact: acerola-labs only runs GitHub's own actions.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: p2p-lcov
          path: lib/p2p/lcov.info

  mutation-test:
    name: Cargo Mutants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Run mutation tests
        run: cargo mutants --package acerola-p2p --output mutants-out

      - name: Upload Mutants Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-report
          path: lib/p2p/mutants-out/
