name: "Release/Android"

on:
  push:
    tags:
      - 'android/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

# The version is written in the release PR (release/android-X.Y.Z, CLAUDE.md): the tag
# android/<channel>/vX.Y.Z, made on that merge on main, must match build.gradle.kts.
# Only GitHub's own actions, pinned by SHA (acerola-labs refuses any other).
jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Extract version
        run: |
          CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag against build.gradle.kts
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' acerola/android/app/build.gradle.kts)
          if [ "$name" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from build.gradle.kts versionName $name."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/acerola
        working-directory: acerola/android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: acerola/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/acerola/android/app/acerola
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/acerola-$VERSION.apk"
        working-directory: acerola/android

      # The APK goes to R2 BEFORE the GitHub release: if either upload fails, the release failed.
      # Permanent copy per version, never overwritten nor deleted: the release history (same idea
      # as a Linux distro package pool).
      # `wrangler r2 object` has no `list`/delete-by-prefix subcommand, so older versions stay in
      # `android/latest/`: the docs/web /api/apk-latest route resolves the highest version there.
      - name: Upload APK to R2
        if: env.CHANNEL == 'prod'
        working-directory: acerola/android
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          apk="app/build/outputs/apk/release/acerola-$VERSION.apk"
          for folder in releases latest; do
            npx --yes wrangler@4.169.0 r2 object put "acerola-reader/android/$folder/acerola-$VERSION.apk" \
              --file="$apk" --content-type=application/vnd.android.package-archive --remote
          done

      # The notes are the tag message: what the version brings, for whoever uses it (acerola-git 2.1).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="acerola/android/app/build/outputs/apk/release/acerola-$VERSION.apk"
          prerelease=""
          if [ "$CHANNEL" != "prod" ]; then prerelease="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag $prerelease \
              --title "Acerola Android $VERSION" --notes-from-tag
          fi
