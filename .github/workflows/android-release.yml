name: "Release/Android"

on:
  push:
    tags:
      - 'android/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Extract version
        run: |
          CHANNEL=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
          VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          VERSION_CODE=$(git tag -l 'android/*/v*' | wc -l | tr -d ' ')
          TAG_NAME="android/${CHANNEL}/v${VERSION}"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update build.gradle.kts
        run: cargo make --makefile makefile.toml bump-android
        env:
          VERSION: ${{ env.VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/acerola
        working-directory: acerola/android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: acerola/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/acerola/android/app/acerola
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk"
        working-directory: acerola/android

      # The APK goes to R2 BEFORE anything is committed or published: if either upload fails, the
      # release failed and nothing else runs (no version commit, no GitHub Release).
      # Permanent copy per version, never overwritten nor deleted: the release history (same idea
      # as a Linux distro package pool).
      - name: Upload APK to R2 (versioned archive)
        if: env.CHANNEL == 'prod'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: acerola/android
          command: >
            r2 object put acerola-reader/android/releases/acerola-${{ env.VERSION }}.apk
            --file=app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk
            --content-type=application/vnd.android.package-archive
            --remote

      # `wrangler r2 object` has no `list`/delete-by-prefix subcommand, so this step does not clean
      # older versions out of `android/latest/`: the docs/web /api/apk-latest route (which resolves
      # the highest version in that folder) tolerates more than one APK there until a cleanup.
      - name: Upload APK to R2 (latest)
        if: env.CHANNEL == 'prod'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: acerola/android
          command: >
            r2 object put acerola-reader/android/latest/acerola-${{ env.VERSION }}.apk
            --file=app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk
            --content-type=application/vnd.android.package-archive
            --remote

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola/android/app/build.gradle.kts
          if ! git diff --staged --quiet; then
            git commit -m "[build](android): Versão ${{ env.VERSION }} [skip ci]"
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done
            BUMP_SHA=$(git rev-parse HEAD)

            # develop gets the very same commit when it has nothing main lacks, so both stay
            # identical; only when develop is ahead the bump is cherry-picked on top of it.
            git fetch origin develop
            if git merge-base --is-ancestor origin/develop "$BUMP_SHA"; then
              git push origin "$BUMP_SHA:refs/heads/develop"
            else
              git checkout -B develop origin/develop
              git cherry-pick "$BUMP_SHA"
              git checkout -- .
              until git push origin develop; do
                git fetch origin develop
                git checkout -- .
                git rebase origin/develop
              done
            fi
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: acerola/android/app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk
          name: "Acerola Android v${{ env.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ env.CHANNEL != 'prod' }}
