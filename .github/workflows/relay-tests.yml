name: "Tests/Relay"

on:
  push:
    branches:
      - develop
    paths:
      - 'lib/relay/**'
      - '.github/workflows/relay-tests.yml'
  workflow_dispatch:

concurrency:
  group: relay-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Workspace Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Rust Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-make
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/registry
            ~/.cargo/git
            lib/relay/target
          key: ${{ runner.os }}-relay-${{ hashFiles('lib/relay/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-relay-

      # After the cache restores ~/.cargo, so an installed tool is not reinstalled.
      - name: Install cargo-make and nextest
        run: |
          command -v cargo-make >/dev/null || cargo install cargo-make --locked
          command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked

      - name: Check Formatting
        run: cargo make --makefile makefile.toml format

      - name: Run All Tests
        run: cargo make --makefile makefile.toml test-all
