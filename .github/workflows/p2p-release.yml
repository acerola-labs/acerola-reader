name: "Release/P2P"

on:
  push:
    tags:
      - 'p2p/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: p2p-release-${{ github.ref }}
  cancel-in-progress: false

# The version is written in the release PR (release/p2p-X.Y.Z, CLAUDE.md): the tag p2p/<channel>/vX.Y.Z,
# made on that merge on main, must match lib/p2p/Cargo.toml.
# Only GitHub's own actions, pinned by SHA (acerola-labs refuses any other).
jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Check the tag against Cargo.toml
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$cargo" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from lib/p2p/Cargo.toml version $cargo."
            exit 1
          fi

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Build Release
        run: cargo make --makefile makefile.toml build-release

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-build
          path: lib/p2p/target/release/
