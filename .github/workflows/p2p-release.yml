name: "Release/P2P"

on:
  push:
    tags:
      - 'p2p/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: p2p-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Acerola standard: only a tag on main publishes (format <app>/<channel>/vX.Y.Z, see CLAUDE.md).
      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update version (Cargo.toml)
        working-directory: ${{ github.workspace }}
        run: cargo make --makefile makefile.toml bump-p2p
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build Release
        run: cargo make --makefile makefile.toml build-release

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: lib/p2p/target/release/

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/p2p/Cargo.toml
          if ! git diff --staged --quiet; then
            git commit -m "[build](p2p): Versão ${{ env.VERSION }} [skip ci]"
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done
            BUMP_SHA=$(git rev-parse HEAD)

            # develop gets the very same commit when it has nothing main lacks, so both stay
            # identical; only when develop is ahead the bump is cherry-picked on top of it.
            git fetch origin develop
            if git merge-base --is-ancestor origin/develop "$BUMP_SHA"; then
              git push origin "$BUMP_SHA:refs/heads/develop"
            else
              git checkout -B develop origin/develop
              git cherry-pick "$BUMP_SHA"
              git checkout -- .
              until git push origin develop; do
                git fetch origin develop
                git checkout -- .
                git rebase origin/develop
              done
            fi
          fi
