name: "Deploy/Web"

on:
  push:
    tags:
      - 'docs/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

# The docs site goes out with the release merge on main: Komodo deploys it through the webhook of the
# hetzner_acerola-reader-docs Procedure (Pull -> Build -> Deploy). The version is written in the
# release PR (release/X.Y.Z, CLAUDE.md). The tag docs/<channel>/vX.Y.Z, made on that merge:
# 1. release: checks that it is on main and matches docs/web/package.json, and creates the GitHub
#    release with the tag message as its notes;
# 2. the Storybooks go to Cloudflare Workers.
# Only GitHub's own actions, pinned by SHA (acerola-labs refuses any other).
jobs:
  release:
    name: Release (GitHub release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Extract version
        run: |
          CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The version comes in the release PR (release/X.Y.Z, CLAUDE.md): the tag must match it.
      - name: Check the tag against package.json
        run: |
          pkg=$(node -p "require('./docs/web/package.json').version")
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from docs/web/package.json version $pkg."
            exit 1
          fi

      # The notes are the tag message: what the version brings, for whoever uses it (acerola-git 2.1).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Versão $VERSION" --notes-from-tag
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Versão $VERSION" --notes-from-tag
          fi

  deploy-storybook-web:
    name: Deploy Storybook (Web)
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.storybook.toml

  deploy-storybook-desktop:
    name: Deploy Storybook (Desktop)
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.storybook.toml
