name: "Deploy/Web"

on:
  push:
    tags:
      - 'docs/**/v*'
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

# Only the version tag publishes (acerola-git; tag format docs/<channel>/vX.Y.Z, see CLAUDE.md):
# 1. release: writes the version from the tag into docs/web/package.json on main and develop (bot
#    commit, [skip ci]) and creates the GitHub release with the tag message as its notes;
# 2. the Storybooks go to Cloudflare Workers.
# The docs site itself is deployed by Komodo: the bump push on main fires the webhook of the
# hetzner_acerola-reader-docs Procedure (Pull -> Build -> Deploy).
# Only GitHub's own actions, pinned by SHA (acerola-labs refuses any other).
jobs:
  release:
    name: Release (version bump and GitHub release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Check the version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag, not from $GITHUB_REF_NAME."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi

      - name: Extract version
        run: |
          CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Same as `cargo make bump-docs` (makefile.toml), without installing cargo-make.
      - name: Update version (package.json)
        run: |
          node -e '
            const fs = require("fs");
            const path = "docs/web/package.json";
            const pkg = fs.readFileSync(path, "utf8");
            fs.writeFileSync(path, pkg.replace(/^(\s*)"version":\s*".*"/m, `$1"version": "${process.env.VERSION}"`));
          '

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/web/package.json
          if ! git diff --staged --quiet; then
            git commit -m "[build](docs): Versão $VERSION [skip ci]"

            until git push origin HEAD:main; do
              git fetch origin main
              git rebase origin/main
            done
            BUMP_SHA=$(git rev-parse HEAD)

            # develop gets the very same commit when it has nothing main lacks, so both stay
            # identical; only when develop is ahead the bump is cherry-picked on top of it.
            git fetch origin develop
            if git merge-base --is-ancestor origin/develop "$BUMP_SHA"; then
              git push origin "$BUMP_SHA:refs/heads/develop"
            else
              git checkout -B develop origin/develop
              git cherry-pick "$BUMP_SHA"
              until git push origin develop; do
                git fetch origin develop
                git rebase origin/develop
              done
            fi
          fi

      # The notes are the tag message: what the version brings, for whoever uses it (acerola-git 2.1).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Docs $VERSION" --notes-from-tag
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Docs $VERSION" --notes-from-tag
          fi

  deploy-storybook-web:
    name: Deploy Storybook (Web)
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.storybook.toml

  deploy-storybook-desktop:
    name: Deploy Storybook (Desktop)
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.storybook.toml
